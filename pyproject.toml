[project]
name = "device-framer"
version = "0.1.0"
description = "Composite screenshots into Apple device bezels from the command line."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "pillow>=10.0",
    "questionary>=2.0",
]

[project.optional-dependencies]
heic = ["pillow-heif>=0.16"]

[project.scripts]
device-framer = "device_framer.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/device_framer"]

[dependency-groups]
dev = ["pytest>=8.0", "mypy>=1.10"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
